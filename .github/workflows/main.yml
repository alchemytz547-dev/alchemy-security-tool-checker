name: Alchemy Security Tool Checker

on:
  push:
  workflow_dispatch:

jobs:
  security-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run Security Tool Checker
        run: python AlchemySecurityToolChecker.py
